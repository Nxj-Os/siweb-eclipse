# Perfil de pruebas PostgreSQL: activar con --spring.profiles.active=demo,demo-postgres
# Crear manualmente la base siweb_eclipse_demo antes de iniciar.
spring.datasource.url=jdbc:postgresql://localhost:5432/siweb_eclipse_demo
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
server.servlet.session.cookie.secure=false

spring.application.name=siweb-eclipse
# Secretos locales (GEMINI_API_KEY): archivo ignorado por git en la raíz del proyecto.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/siweb_eclipse
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
app.demo-mode=false
app.catalog.seed-demo-data=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
app.auth.email.dominios-permitidos=${APP_AUTH_EMAIL_DOMINIOS_PERMITIDOS:gmail.com,hotmail.com,outlook.com,yahoo.com}
app.auth.email.dominios-desechables=${APP_AUTH_EMAIL_DOMINIOS_DESECHABLES:10minutemail.com,dispostable.com,guerrillamail.com,mailinator.com,tempmail.com,yopmail.com}
# Room service: minutos desde la creación del pedido para cada avance automático de estado.
app.roomservice.estados.minutos-en-preparacion=3
app.roomservice.estados.minutos-controlado=7
app.roomservice.estados.minutos-entregado=12
app.chat.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.chat.api-key=${GEMINI_API_KEY:}
app.chat.modelo=${GEMINI_MODEL:gemini-2.5-flash}
app.chat.timeout-ms=${GEMINI_TIMEOUT_MS:20000}
app.chat.max-historial=${APP_CHAT_MAX_HISTORIAL:12}
app.chat.max-entrada=${APP_CHAT_MAX_ENTRADA:600}
app.chat.limite-publico-min=${APP_CHAT_LIMITE_PUBLICO_MIN:10}
app.chat.limite-cliente-min=${APP_CHAT_LIMITE_CLIENTE_MIN:30}
app.chat.max-mensajes-anonimos=${APP_CHAT_MAX_MENSAJES_ANONIMOS:12}

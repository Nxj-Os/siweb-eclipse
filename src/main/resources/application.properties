spring.application.name=siweb-eclipse
spring.datasource.url=jdbc:postgresql://localhost:5432/siweb_eclipse
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
app.auth.email.dominios-permitidos=${APP_AUTH_EMAIL_DOMINIOS_PERMITIDOS:gmail.com,hotmail.com,outlook.com,yahoo.com}
app.auth.email.dominios-desechables=${APP_AUTH_EMAIL_DOMINIOS_DESECHABLES:10minutemail.com,dispostable.com,guerrillamail.com,mailinator.com,tempmail.com,yopmail.com}

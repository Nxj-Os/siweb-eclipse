<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071514">
    <title>Crear cuenta | Hotel Eclipse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="login-page">
    <main class="login-layout">
        <a class="login-brand" th:href="@{/}" aria-label="Volver al inicio">
            <span class="brand__seal" aria-hidden="true"><span>E</span><i></i></span>
            <span class="brand__name">ECLIPSE</span>
            <span class="brand__descriptor">SUITES HOTEL</span>
        </a>

        <section class="login-panel" aria-labelledby="register-title">
            <p class="login-eyebrow">ECLIPSE SUITES HOTEL</p>
            <h1 id="register-title">Crea tu cuenta</h1>
            <p class="login-intro">Completa tus datos para registrarte como cliente.</p>

            <form id="register-form" class="login-form" autocomplete="on">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" maxlength="100" autocomplete="given-name" required>

                <label for="apellido">Apellido</label>
                <input id="apellido" name="apellido" maxlength="100" autocomplete="family-name" required>

                <label for="tipoDocumento">Tipo de documento</label>
                <select id="tipoDocumento" name="tipoDocumento" required>
                    <option value="DNI">DNI</option>
                    <option value="CE">Carné de extranjería</option>
                    <option value="PASAPORTE">Pasaporte</option>
                </select>

                <label for="numDocumento">Número de documento</label>
                <input id="numDocumento" name="numDocumento" maxlength="20" required>

                <label for="paisEmisionDoc">País emisor (código de 3 letras)</label>
                <input id="paisEmisionDoc" name="paisEmisionDoc" value="PER" maxlength="3" pattern="[A-Za-z]{3}" autocomplete="country" required>

                <label for="correoElectronico">Correo electrónico</label>
                <input id="correoElectronico" name="correoElectronico" type="email" maxlength="100" autocomplete="email" required>

                <label for="telefono">Teléfono</label>
                <input id="telefono" name="telefono" type="tel" maxlength="20" autocomplete="tel" required>

                <label for="edad">Edad</label>
                <input id="edad" name="edad" type="number" min="1" max="120" required>

                <label for="password">Contraseña (mínimo 8 caracteres)</label>
                <input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>

                <label for="confirmPassword">Repite la contraseña</label>
                <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>

                <p id="register-message" class="login-message" role="status" aria-live="polite"></p>
                <button id="register-submit" class="role-link login-submit" type="submit">Crear cuenta</button>
            </form>

            <a class="login-back" th:href="@{/login(tipo='cliente')}">Ya tengo una cuenta</a>
            <a class="login-back" th:href="@{/}">Volver al inicio</a>
        </section>
    </main>
    <script th:src="@{/js/auth-login.js}" defer></script>
</body>
</html>

<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}"><title>Agenda | Hotel Eclipse</title><link rel="stylesheet" th:href="@{/css/agenda-eclipse.css}"><link rel="stylesheet" href="/css/cuenta-eclipse.css"></head><body>
<header class="bar"><a href="/empleado">✦ HOTEL ECLIPSE</a><nav><a href="/empleado/perfil">Mi cuenta</a><a href="/empleado/recepcion">Rack</a></nav><button id="bell" type="button">🔔 <span id="unread">0</span></button></header>
<main><div class="heading"><div><p class="eyebrow">PORTAL DE EMPLEADOS</p><h1>Calendario de reservas y actividades</h1><p>Programación, tiempos estimados, estados y seguimiento</p></div><button id="add" class="primary">+ Programar</button></div>
<div class="columns"><section class="panel"><div class="monthnav"><button id="prev">‹</button><h2 id="month"></h2><button id="next">›</button></div><div class="calendar" id="calendar"></div></section><section class="panel"><h2>Programación <span id="selected"></span></h2><div id="events" class="events"></div></section></div>
<section class="panel"><h2>Próximos registros y seguimiento</h2><div id="upcoming"></div></section></main>
<dialog id="formDialog"><form id="eventForm"><h2>Nueva reserva o actividad</h2><label>Tipo<select name="tipo"><option>RESERVA</option><option>ACTIVIDAD</option></select></label><label>Título<input name="titulo" maxlength="120" required></label><label>Suite / habitación<input name="suite" maxlength="30" required></label><label>Inicio programado<input name="inicio" type="datetime-local" required></label><label>Fin programado<input name="fin" type="datetime-local" required></label><label>Responsable (usuario)<input name="responsable" maxlength="80"></label><label>Descripción<textarea name="descripcion" maxlength="1500"></textarea></label><p id="formError" class="error"></p><div class="actions"><button type="button" data-close="formDialog">Cancelar</button><button class="primary">Guardar</button></div></form></dialog>
<dialog id="detailDialog"><div id="detail"></div><div class="actions"><button data-close="detailDialog">Cerrar</button></div></dialog>
<dialog id="notifyDialog"><h2>Notificaciones</h2><p>Se actualizan automáticamente cada 15 segundos.</p><div id="notices"></div><div class="actions"><button data-close="notifyDialog">Cerrar</button></div></dialog>
<dialog id="notificationDetailDialog" class="eclipse-detail-dialog"><div id="notificationDetailContent"></div><button type="button" onclick="this.closest('dialog').close()">Cerrar</button></dialog><script th:src="@{/js/agenda-eclipse.js}" defer></script><script src="/js/cuenta-eclipse.js" defer></script></body></html>
